[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "battery-detective"
version = "0.1.0"
description = "Local macOS battery telemetry and evidence-based investigations"
requires-python = ">=3.11"
dependencies = ["psutil>=6.1,<8", "pyobjc-framework-Cocoa>=10.3,<13; sys_platform == 'darwin'"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
battery-detective = "battery_detective.cli:main"

[tool.setuptools.packages.find]
include = ["battery_detective*"]

[tool.setuptools.package-data]
"battery_detective.storage" = ["schema.sql"]
"battery_detective.dashboard" = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
